{% extends 'library_list.html' %}

{% block title %}Snippets - Fenris{% endblock %}

{% block page_context_label %}snippets{% endblock %}

{% block add_button %}
<a href="{% url 'add_snippet' %}{% if current_query_string %}?return_q={{ current_query_string|urlencode }}{% endif %}"><button type="button">add snippet</button></a>
{% endblock %}

{% block owner_actions %}
<a class="action-btn edit-btn" href="{% url 'edit_snippet' item.pk %}{% if current_query_string %}?return_q={{ current_query_string|urlencode }}{% endif %}">edit</a>
<form method="post" style="display: inline;">
    {% csrf_token %}
    <input type="hidden" name="action" value="delete">
    <input type="hidden" name="pk" value="{{ item.pk }}">
    <input type="hidden" name="return_q" value="{{ current_query_string }}">
    <button type="submit" class="action-btn delete-btn" onclick="return confirm('Delete snippet &quot;{{ item.name|escapejs }}&quot;?');">delete</button>
</form>
{% endblock %}
