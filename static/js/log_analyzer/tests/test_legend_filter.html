<!DOCTYPE html>
<!--
  Tests for the legend status filter (bootstrap.js toggleStatusVisibility +
  the .hide-status-* rules in log_analyzer.css) against real rendered markup.

  The legend counts lines by VERDICT (dominant_status). The filter therefore has
  to hide/show by verdict too. It used to select on the .status-* paint class,
  which for a filepath-fallback match is deliberately 'status-unknown' even
  though the verdict is B -- so a log with 5 B lines showed "B (5)" in the
  legend but only the non-fallback one survived a "B only" filter.
  renderLogLines() now stamps data-verdict-class and the CSS matches on that.

  Open this file directly in a browser (no build step needed).
  Pass = green row, Fail = red row with an error message.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>log analyzer legend filter tests</title>
<link rel="stylesheet" href="../../../css/log_analyzer.css">
<style>
  body { font-family: monospace; padding: 16px; background: #1a1a1a; color: #ccc; }
  h1   { font-size: 1rem; margin-bottom: 12px; }
  .pass { color: #6f9; }
  .fail { color: #f66; }
  #summary { margin-top: 12px; font-weight: bold; }
</style>
</head>
<body>
<h1>log analyzer &ndash; legend filter tests</h1>
<ul id="results"></ul>
<div id="summary"></div>

<!-- The container renderLogLines() fills and the filter toggles classes on -->
<div id="logLines" class="log-lines-container"></div>

<script src="../../common.js"></script>
<script src="../../popup_menu.js"></script>
<script src="../shared.js"></script>
<script src="../analysis.js"></script>

<script>
// ---------------------------------------------------------------------------
// Tiny test harness (same shape as test_legend_counts.html)
// ---------------------------------------------------------------------------
let passed = 0;
let failed = 0;
const list = document.getElementById('results');

function assert(description, condition, detail) {
    const li = document.createElement('li');
    if (condition) {
        li.className = 'pass';
        li.textContent = '✓ ' + description;
        passed++;
    } else {
        li.className = 'fail';
        li.textContent = '✗ ' + description + (detail ? ' — ' + detail : '');
        failed++;
    }
    list.appendChild(li);
}

const container = document.getElementById('logLines');

// Mirrors toggleStatusVisibility()/toggleAllStatusVisibility() in bootstrap.js,
// which is not loaded here because it self-initialises on DOMContentLoaded.
function showOnly(statusClass) {
    ALL_LEGEND_STATUS_CLASSES.forEach((sc) => {
        container.classList.toggle(HIDE_CLASS_PREFIX + sc, sc !== statusClass);
    });
}

function visibleLines() {
    return [...container.querySelectorAll('.log-line')].filter(
        (el) => getComputedStyle(el).display !== 'none'
    );
}

function visibleTexts() {
    return visibleLines().map((el) => el.querySelector('.line-text').textContent);
}

// A log with five malware verdicts: four matched only via the weak filepath
// fallback (painted 'status-unknown'), one matched outright (painted B).
analyzedLines = [
    { line: 'B fallback 1', dominant_status: 'B', css_class: 'status-unknown' },
    { line: 'B fallback 2', dominant_status: 'B', css_class: 'status-unknown' },
    { line: 'B fallback 3', dominant_status: 'B', css_class: 'status-unknown' },
    { line: 'B fallback 4', dominant_status: 'B', css_class: 'status-unknown' },
    { line: 'B direct', dominant_status: 'B', css_class: 'status-b' },
    { line: 'clean line', dominant_status: 'C', css_class: 'status-c' },
    { line: 'mystery line', dominant_status: '?', css_class: 'status-unknown' },
];
renderLogLines();

// ---------------------------------------------------------------------------
// renderLogLines stamps the verdict, not the paint class
// ---------------------------------------------------------------------------
(function testVerdictAttributeStamped() {
    const divs = [...container.querySelectorAll('.log-line')];
    const fallback = divs[0];

    assert(
        'a fallback-only B line keeps its unknown paint class',
        fallback.classList.contains('status-unknown'),
        'classes: ' + fallback.className
    );
    assert(
        'a fallback-only B line is stamped with data-verdict-class="status-b"',
        fallback.dataset.verdictClass === 'status-b',
        'got ' + fallback.dataset.verdictClass
    );
    assert(
        'a genuinely unknown line is stamped with data-verdict-class="status-unknown"',
        divs[6].dataset.verdictClass === 'status-unknown',
        'got ' + divs[6].dataset.verdictClass
    );
})();

// ---------------------------------------------------------------------------
// Filtering to B shows every B verdict, not just the directly-painted one
// ---------------------------------------------------------------------------
(function testFilterShowsAllMalwareVerdicts() {
    showOnly('status-b');

    assert(
        'filtering to B shows all 5 malware verdicts, not only the 1 painted B',
        visibleLines().length === 5,
        'visible: ' + JSON.stringify(visibleTexts())
    );
    assert(
        'filtering to B hides the clean and unknown lines',
        !visibleTexts().includes('clean line') && !visibleTexts().includes('mystery line'),
        'visible: ' + JSON.stringify(visibleTexts())
    );
})();

// ---------------------------------------------------------------------------
// The unknown filter no longer sweeps up fallback-matched malware
// ---------------------------------------------------------------------------
(function testUnknownFilterExcludesFallbackMalware() {
    showOnly('status-unknown');

    assert(
        'filtering to unknown shows only the 1 genuinely unknown line',
        visibleTexts().length === 1 && visibleTexts()[0] === 'mystery line',
        'visible: ' + JSON.stringify(visibleTexts())
    );
})();

// ---------------------------------------------------------------------------
// Hiding a single status still works for lines whose paint matches the verdict
// ---------------------------------------------------------------------------
(function testHideSingleStatus() {
    ALL_LEGEND_STATUS_CLASSES.forEach((sc) => {
        container.classList.remove(HIDE_CLASS_PREFIX + sc);
    });
    container.classList.add(HIDE_CLASS_PREFIX + 'status-b');

    assert(
        'hiding B removes all 5 malware verdicts and keeps the other 2 lines',
        visibleTexts().length === 2
            && visibleTexts().includes('clean line')
            && visibleTexts().includes('mystery line'),
        'visible: ' + JSON.stringify(visibleTexts())
    );
})();

// ---------------------------------------------------------------------------
// The tag filter re-marks the rendered lines in place (no re-render)
// ---------------------------------------------------------------------------
(function testTagFilterMarksLinesInPlace() {
    ALL_LEGEND_STATUS_CLASSES.forEach((sc) => container.classList.remove(HIDE_CLASS_PREFIX + sc));
    const before = [...container.querySelectorAll('.log-line')];
    window.lineMatchesTagFilter = (entry) => entry.line.startsWith('B');
    applyTagFilterMatches();
    const after = [...container.querySelectorAll('.log-line')];
    assert(
        'applyTagFilterMatches keeps the same line elements',
        before.length === after.length && before.every((el, i) => el === after[i])
    );
    assert(
        'applyTagFilterMatches marks exactly the matching lines',
        after.filter((el) => el.classList.contains('tag-filter-match')).length === 5
            && after.every((el) => el.classList.contains('tag-filter-match')
                === el.querySelector('.line-text').textContent.startsWith('B')),
        after.map((el) => el.className).join(' | ')
    );
    window.lineMatchesTagFilter = () => false;
    applyTagFilterMatches();
    assert(
        'clearing the filter unmarks every line',
        !container.querySelector('.tag-filter-match')
    );
    delete window.lineMatchesTagFilter;
})();

// ---------------------------------------------------------------------------
// Lines say what they hold as classes (the CSS has no :has() rules on lines)
// ---------------------------------------------------------------------------
(function testLineClassesForCorrelationsAndChips() {
    window.buildCaseCorrelationButton = (entry) => {
        if (entry.line !== 'clean line') return null;
        const button = document.createElement('button');
        button.className = 'line-correlation-trigger';
        return button;
    };
    window.buildCentralboxSuggestionChip = (entry) => {
        if (entry.line !== 'mystery line') return null;
        const chip = document.createElement('span');
        chip.className = 'centralbox-suggestion-chip';
        return chip;
    };
    renderLogLines();
    const byText = (text) => [...container.querySelectorAll('.log-line')]
        .find((el) => el.querySelector('.line-text').textContent === text);
    const clean = byText('clean line');
    const mystery = byText('mystery line');
    assert(
        'a line with a correlation icon has has-correlation on the line and its actions',
        clean.classList.contains('has-correlation') && clean.querySelector('.line-actions').classList.contains('has-correlation')
            && !clean.classList.contains('has-chips')
    );
    assert(
        'a line with a centralbox suggestion has has-chips',
        mystery.classList.contains('has-chips') && !mystery.classList.contains('has-correlation')
    );
    assert(
        'other lines have neither',
        !byText('B direct').classList.contains('has-chips') && !byText('B direct').classList.contains('has-correlation')
    );
    assert(
        'every line knows its index for the in-place tag filter',
        [...container.querySelectorAll('.log-line')].every((el, i) => el.dataset.lineIndex === String(i))
    );
    let hasRules = 0;
    for (const sheet of document.styleSheets) {
        try {
            for (const rule of sheet.cssRules) if (rule.selectorText && rule.selectorText.includes(':has(')) hasRules++;
        } catch (error) { /* another origin */ }
    }
    assert('log_analyzer.css has no :has() rules (they make big logs slow)', hasRules === 0, String(hasRules));
    delete window.buildCaseCorrelationButton;
    delete window.buildCentralboxSuggestionChip;
    renderLogLines();
})();

// ---------------------------------------------------------------------------
// Correlations / centralbox suggestions arriving update the lines in place
// ---------------------------------------------------------------------------
(function testRefreshLineExtrasInPlace() {
    renderLogLines();
    const before = [...container.querySelectorAll('.log-line')];
    const byText = (text) => [...container.querySelectorAll('.log-line')]
        .find((el) => el.querySelector('.line-text').textContent === text);
    window.buildCaseCorrelationButton = (entry) => {
        if (entry.line !== 'clean line') return null;
        const button = document.createElement('button');
        button.className = 'line-correlation-trigger';
        return button;
    };
    window.buildCentralboxSuggestionChip = (entry) => {
        if (entry.line !== 'mystery line') return null;
        const chip = document.createElement('span');
        chip.className = 'centralbox-suggestion-chip';
        return chip;
    };
    refreshLineExtras();
    const after = [...container.querySelectorAll('.log-line')];
    assert('refreshLineExtras keeps the same line elements',
        before.length === after.length && before.every((el, i) => el === after[i]));
    const clean = byText('clean line');
    assert('an arriving correlation adds the info icon last in the line actions, with has-correlation',
        clean.querySelector('.line-actions').lastElementChild.className === 'line-correlation-trigger'
            && clean.classList.contains('has-correlation')
            && clean.querySelector('.line-actions').classList.contains('has-correlation'));
    const mystery = byText('mystery line');
    assert('an arriving suggestion adds the chip right before the line actions, with has-chips',
        mystery.querySelector('.centralbox-suggestion-chip').nextElementSibling === mystery.querySelector('.line-actions')
            && mystery.classList.contains('has-chips'));

    refreshLineExtras();
    assert('refreshing again keeps one icon and one chip, not two',
        clean.querySelectorAll('.line-correlation-trigger').length === 1
            && mystery.querySelectorAll('.centralbox-suggestion-chip').length === 1);

    window.buildCaseCorrelationButton = () => null;
    window.buildCentralboxSuggestionChip = () => null;
    refreshLineExtras();
    assert('a correlation or suggestion that is gone takes its icon, chip and classes along',
        !container.querySelector('.line-correlation-trigger, .centralbox-suggestion-chip, .has-correlation, .has-chips'));
    delete window.buildCaseCorrelationButton;
    delete window.buildCentralboxSuggestionChip;
})();

// ---------------------------------------------------------------------------
// A fresh analysis that matches the shown one is recognized (not redrawn)
// ---------------------------------------------------------------------------
(function testShownAnalysisIsRecognized() {
    if (typeof window.scheduleDraftSave !== 'function') window.scheduleDraftSave = () => {};
    if (!document.getElementById('analysisWarnings')) {
        const warnings = document.createElement('div');
        warnings.id = 'analysisWarnings';
        warnings.hidden = true;
        document.body.appendChild(warnings);
    }
    const payload = () => ({
        lines: [
            { line: 'B direct', dominant_status: 'B', css_class: 'status-b' },
            { line: 'clean line', dominant_status: 'C', css_class: 'status-c' },
        ],
        warnings: [],
        summary: { total_lines: 2 },
    });
    applyAnalysisPayload(payload(), { resetCopied: true });
    assert('the same analysis, as a new object, counts as shown', analysisPayloadIsShown(payload()));
    const changed = payload();
    changed.lines[1].dominant_status = 'P';
    assert('an analysis with a changed verdict does not', !analysisPayloadIsShown(changed));
    const reordered = payload();
    reordered.lines[0] = { css_class: 'status-b', dominant_status: 'B', line: 'B direct' };
    assert('key order matters (the server sorts keys, so equal analyses have equal text)',
        !analysisPayloadIsShown(reordered));
})();

// ---------------------------------------------------------------------------
// Showing a status with many lines brings them back in batches, view first
// ---------------------------------------------------------------------------
(function testProgressiveReveal() {
    analyzedLines = [];
    for (let i = 0; i < 12; i++) analyzedLines.push({ line: `unknown ${i}`, dominant_status: '?', css_class: 'status-unknown' });
    analyzedLines.push({ line: 'clean line', dominant_status: 'C', css_class: 'status-c' });
    renderLogLines();
    const visibleCount = () => [...container.querySelectorAll(':scope > .log-line')]
        .filter((el) => getComputedStyle(el).display !== 'none').length;
    const frames = [];
    const schedule = (callback) => { frames.push(callback); return frames.length; };
    const options = { atOnceMax: 3, batch: 5, schedule };
    const runFrame = () => frames.shift()();

    hideStatusClasses(container, ['status-unknown']);
    assert('hiding ? leaves the clean line', visibleCount() === 1, String(visibleCount()));
    let done = false;
    showStatusClasses(container, ['status-unknown'], options).then(() => { done = true; });
    assert('the legend class is gone at once', !container.classList.contains('hide-status-unknown'));
    assert('the first batch shows right away, the rest waits', visibleCount() === 1 + 5
        && container.querySelectorAll('.reveal-pending').length === 7, String(visibleCount()));
    assert('the unknown lines at the top come first', container.querySelector('.log-line .line-text').textContent === 'unknown 0'
        && getComputedStyle(container.querySelector('.log-line')).display !== 'none');
    runFrame();
    assert('the next frame shows the next batch', visibleCount() === 1 + 10, String(visibleCount()));
    runFrame();
    assert('the last frame shows the rest and nothing is left pending',
        visibleCount() === 13 && !container.querySelector('.reveal-pending') && frames.length === 0, String(visibleCount()));

    // Hidden again before all came back: the rest stop waiting.
    hideStatusClasses(container, ['status-unknown']);
    showStatusClasses(container, ['status-unknown'], options);
    hideStatusClasses(container, ['status-unknown']);
    while (frames.length) runFrame();
    assert('hiding during the reveal leaves no line pending and the status hidden',
        !container.querySelector('.reveal-pending') && visibleCount() === 1, String(visibleCount()));

    // Few lines come back at once, without frames.
    hideStatusClasses(container, ['status-c']);
    showStatusClasses(container, ['status-c'], options);
    assert('a status with few lines shows at once', frames.length === 0 && visibleCount() === 1, String(visibleCount()));
    showStatusClasses(container, ['status-unknown']);
})();

// ---------------------------------------------------------------------------
// Summary
// ---------------------------------------------------------------------------
const summary = document.getElementById('summary');
summary.textContent = passed + ' passed, ' + failed + ' failed';
summary.style.color = failed === 0 ? '#6f9' : '#f66';
</script>
</body>
</html>
