<!DOCTYPE html>
<!--
  Tests for the "queue substring rule" item in the entity lookup menu
  (analysis.js renderLookupItemsMenu / renderLookupStatusMenu, shared.js
  queueTokenRule / tokenRuleEffectForEntry / applyPendingOverrides).

  Two things are pinned down here:

  1. The payload. A token rule has no endpoint of its own — it rides the normal
     pending-change flow, and the server's parse_rule_line only makes it a
     substring rule because the line carries a `SUBSTRING:` prefix. Lose the
     prefix and the analyzer silently starts writing exact-line rules instead.
     The Django-side half of that contract lives in
     fixlist/tests/test_analyzer_substring_rule_creation.py.

  2. The preview. A queued rule reclassifies the current lines before it is
     saved, but only where a real substring rule (default priority 7) would
     actually win — otherwise the analyzer would promise a verdict the engine
     overrules on the next scan.

  Open this file directly in a browser (no build step needed).
  Pass = green row, Fail = red row with an error message.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>analysis.js lookup rule menu tests</title>
<style>
  body { font-family: monospace; padding: 16px; background: #1a1a1a; color: #ccc; }
  h1   { font-size: 1rem; margin-bottom: 12px; }
  .pass { color: #6f9; }
  .fail { color: #f66; }
  #summary { margin-top: 12px; font-weight: bold; }
</style>
</head>
<body>
<h1>analysis.js – lookup rule menu tests</h1>
<ul id="results"></ul>
<div id="summary"></div>

<div id="logLines"></div>

<script>
// Read by shared.js at load time, so it has to be set before the script tag.
// A username with no guest token is what unlocks the rule item.
window.logAnalyzerConfig = {
    analyzeLogUrl: '/fake/analyze/',
    lineDetailsUrl: '/fake/details/',
    persistRuleChangesUrl: '/fake/persist/',
    currentUsername: 'tester',
    guestToken: '',
};

// Defined in draft_autosave.js / bootstrap.js, which are not loaded here.
function scheduleDraftSave() {}
</script>

<script src="../shared.js"></script>
<script src="../analysis.js"></script>

<script>
// Picking a status repaints the analyzer. That repaint needs the full analyzer
// DOM, which is not built here, so it is stubbed out and the resulting state is
// asserted directly instead.
renderLogLines = function () {};
updateSummary = function () {};

// ---------------------------------------------------------------------------
// Tiny test harness (same shape as test_url_lookup_spans.html)
// ---------------------------------------------------------------------------
let passed = 0;
let failed = 0;
const list = document.getElementById('results');

function assert(description, condition, detail) {
    const li = document.createElement('li');
    if (condition) {
        li.className = 'pass';
        li.textContent = '✓ ' + description;
        passed++;
    } else {
        li.className = 'fail';
        li.textContent = '✗ ' + description + (detail ? ' — ' + detail : '');
        failed++;
    }
    list.appendChild(li);
}

function reset() {
    closeLookupMenu();
    pendingTokenRules = new Map();
    pendingStatusChanges = new Map();
    pendingChangeSequence = 0;
    analyzedLines = [];
}

function makeTrigger() {
    const btn = document.createElement('button');
    btn.type = 'button';
    document.body.appendChild(btn);
    return btn;
}

function menuItems() {
    return Array.from(document.querySelectorAll('.lookup-menu .lookup-menu-item'));
}

function menuLabels() {
    return menuItems().map((el) => el.textContent);
}

function ruleItem() {
    return menuItems().find((el) => el.textContent === 'queue substring rule');
}

// A server-shaped analysis payload run through the same keying the analyzer uses.
function loadLines(lines) {
    analyzedLines = attachLineKeys(lines);
}

// Default priority per match type (DEFAULT_PRIORITY_BY_MATCH_TYPE in models.py).
const DEFAULT_PRIORITY = { exact: 19, parsed_entry: 15, filepath: 11, substring: 7, regex: 3 };

// A line as the server reports it when one whole-line rule decides it: the rule's
// status is both the verdict and the colour of the whole line. `matcher` picks
// the priority; pass a number for a rule with a custom one.
function line(text, status, matcher) {
    const matched = Boolean(status) && status !== '?';
    const priority = typeof matcher === 'number' ? matcher : DEFAULT_PRIORITY[matcher];
    return {
        line: text,
        dominant_status: status || '?',
        status_codes: status || '?',
        matcher: typeof matcher === 'string' ? matcher : '',
        reasons: [],
        matched,
        css_class: matched ? STATUS_CLASS_MAP[status] : 'status-unknown',
        paint_base: matched ? { status, priority } : null,
        highlights: [],
        verdict_priority: matched ? priority : null,
        fallback_only: false,
    };
}

// The coloured parts of a line as "start-end:status:priority ...".
function highlightShape(index) {
    return (analyzedLines[index].highlights || [])
        .map((h) => `${h.start}-${h.end}:${h.status}:${h.priority}`)
        .join(' ');
}

function tokenSpan(text, token, status, priority) {
    const start = text.indexOf(token);
    return `${start}-${start + token.length}:${status}:${priority}`;
}

function statusOf(index) {
    return analyzedLines[index].dominant_status;
}

// ---------------------------------------------------------------------------
// Queued payload — the SUBSTRING: prefix is the whole contract
// ---------------------------------------------------------------------------
(function testQueuedPayloadShape() {
    reset();
    queueTokenRule('1.2.3.4', 'B');
    const payload = getPendingStatusChangesPayload();

    assert('one change is queued', payload.length === 1, 'got ' + payload.length);
    assert(
        'line carries the SUBSTRING: prefix',
        payload[0].line === 'SUBSTRING:1.2.3.4',
        'got ' + payload[0].line
    );
    assert('new_status is the chosen status', payload[0].new_status === 'B', 'got ' + payload[0].new_status);
    assert('original_status is unknown', payload[0].original_status === '?', 'got ' + payload[0].original_status);
    assert('the queued rule counts as pending work', totalPendingChangeCount() === 1);
})();

// A rule has to match the text the log actually carries, so the defanged form is
// kept verbatim — refangUrl exists only to make external lookups resolve.
(function testDefangedUrlKeptVerbatim() {
    reset();
    queueTokenRule('hxxps://evil.example/a', 'B');
    assert(
        'defanged URL is not refanged into the rule pattern',
        getPendingStatusChangesPayload()[0].line === 'SUBSTRING:hxxps://evil.example/a',
        'got ' + getPendingStatusChangesPayload()[0].line
    );
})();

(function testQueueingIsIdempotent() {
    reset();
    queueTokenRule('1.2.3.4', 'B');
    queueTokenRule('1.2.3.4', 'B');
    assert('the same token and status queues once', pendingTokenRules.size === 1, 'got ' + pendingTokenRules.size);

    queueTokenRule('1.2.3.4', 'P');
    assert('a different status queues separately', pendingTokenRules.size === 2, 'got ' + pendingTokenRules.size);
})();

// ---------------------------------------------------------------------------
// Queued rules classify the current lines before they are saved
// ---------------------------------------------------------------------------
(function testQueuedRuleClassifiesUnmatchedLines() {
    reset();
    loadLines([
        line('R2 evilsvc; C:\\Windows\\1.2.3.4\\bad.exe [X]'),
        line('Hosts: 1.2.3.4 evil.example'),
        line('R2 goodsvc; C:\\Windows\\good.exe [X]'),
    ]);

    queueTokenRule('1.2.3.4', 'B');
    applyPendingOverrides();

    assert('first matching line is reclassified', statusOf(0) === 'B', 'got ' + statusOf(0));
    assert('second matching line is reclassified', statusOf(1) === 'B', 'got ' + statusOf(1));
    assert('a non-matching line is untouched', statusOf(2) === '?', 'got ' + statusOf(2));
    assert(
        'the override is spelled out in the line reasons',
        analyzedLines[0].reasons.some((r) => r.indexOf('pending substring rule') !== -1),
        analyzedLines[0].reasons.join(' | ')
    );
    assert(
        'the reclassified line counts as matched',
        analyzedLines[0].matched === true
    );
})();

(function testQueuedRuleIsSubstringAndCaseSensitive() {
    reset();
    loadLines([
        line('CHR Extension: (Bad) - C:\\path\\abcdefghijklmnopabcdefghijklmnop [2026-01-01]'),
        line('CHR Extension: (Shouty) - C:\\path\\ABCDEFGHIJKLMNOPABCDEFGHIJKLMNOP [2026-01-01]'),
    ]);

    queueTokenRule('abcdefghijklmnopabcdefghijklmnop', 'B');
    applyPendingOverrides();

    assert('the token matches anywhere in the line', statusOf(0) === 'B', 'got ' + statusOf(0));
    assert(
        'matching is case-sensitive, as it is server-side',
        statusOf(1) === '?',
        'got ' + statusOf(1)
    );
})();

// ---------------------------------------------------------------------------
// The preview must not promise a verdict the engine would overrule
// ---------------------------------------------------------------------------
(function testHigherTierMatchesWin() {
    reset();
    loadLines([
        line('R2 evil; C:\\bad\\1.2.3.4.exe [X]', 'C', 'exact'),
        line('R2 evil; C:\\bad\\1.2.3.4.dll [X]', 'C', 'parsed_entry'),
        line('R2 evil; C:\\bad\\1.2.3.4.sys [X]', 'C', 'filepath'),
        line('R2 evil; C:\\bad\\1.2.3.4.dat [X]', 'C', 'regex'),
    ]);

    queueTokenRule('1.2.3.4', 'B');
    applyPendingOverrides();

    assert('an exact match outranks the queued rule', statusOf(0) === 'C', 'got ' + statusOf(0));
    assert('a parsed-entry match outranks it', statusOf(1) === 'C', 'got ' + statusOf(1));
    assert('a filepath match outranks it', statusOf(2) === 'C', 'got ' + statusOf(2));
    assert('a regex match is outranked by it', statusOf(3) === 'B', 'got ' + statusOf(3));
    assert(
        'under a higher whole-line colour the token does not show',
        highlightShape(0) === '' && analyzedLines[0].css_class === 'status-c',
        'got ' + highlightShape(0) + ' ' + analyzedLines[0].css_class
    );
    assert(
        'over a lower whole-line colour the token is painted on top of it',
        highlightShape(3) === tokenSpan(analyzedLines[3].line, '1.2.3.4', 'B', 7)
            && analyzedLines[3].css_class === 'status-c',
        'got ' + highlightShape(3) + ' ' + analyzedLines[3].css_class
    );
})();

(function testCustomPriorityDecidesTheVerdict() {
    reset();
    // A substring rule raised to priority 9 decides this line and colours only
    // "Microsoft"; the queued rule (priority 7) cannot change the verdict.
    const text = 'Microsoft loads 1.2.3.4';
    loadLines([{
        ...line(text, 'C', 9),
        css_class: 'status-unknown',
        paint_base: null,
        highlights: [{ start: 0, end: 9, status: 'C', priority: 9 }],
    }]);

    queueTokenRule('1.2.3.4', 'B');
    applyPendingOverrides();

    assert('the higher-priority verdict stays', statusOf(0) === 'C', 'got ' + statusOf(0));
    assert(
        'the token is still painted where nothing covers it',
        highlightShape(0) === '0-9:C:9 16-23:B:7',
        'got ' + highlightShape(0)
    );
    assert(
        'painting alone adds no pending-rule reason',
        analyzedLines[0].reasons.length === 0,
        analyzedLines[0].reasons.join(' | ')
    );
})();

(function testSameTierBreaksOnStatusPrecedence() {
    reset();
    loadLines([
        line('R2 a; C:\\bad\\1.2.3.4.exe [X]', 'C', 'substring'),
        line('R2 b; C:\\bad\\1.2.3.4.dll [X]', 'B', 'substring'),
    ]);

    queueTokenRule('1.2.3.4', 'B');
    applyPendingOverrides();

    assert(
        'a stronger verdict takes over at the same tier',
        statusOf(0) === 'B',
        'got ' + statusOf(0)
    );
    assert(
        'an equally strong existing verdict is left alone',
        statusOf(1) === 'B',
        'got ' + statusOf(1)
    );
})();

(function testExplicitLineOverrideWins() {
    reset();
    loadLines([line('Hosts: 1.2.3.4 evil.example')]);

    pendingChangeSequence += 1;
    pendingStatusChanges.set(pendingOverrideKeyForEntry(analyzedLines[0]), {
        id: String(pendingChangeSequence),
        order: pendingChangeSequence,
        line: analyzedLines[0].line,
        original_status: '?',
        new_status: 'C',
    });
    queueTokenRule('1.2.3.4', 'B');
    applyPendingOverrides();

    assert(
        'a per-line override beats a queued token rule',
        statusOf(0) === 'C',
        'got ' + statusOf(0)
    );
})();

(function testStrongestQueuedRuleWins() {
    reset();
    loadLines([line('Hosts: 1.2.3.4 evil.example')]);

    queueTokenRule('evil.example', 'P');
    queueTokenRule('1.2.3.4', 'B');
    applyPendingOverrides();

    assert(
        'the strongest of several matching queued rules wins',
        statusOf(0) === 'B',
        'got ' + statusOf(0)
    );
})();

// ---------------------------------------------------------------------------
// Queued rules are saved matched-part-only, so they paint just their token, on
// top of whatever lower-priority rules painted
// ---------------------------------------------------------------------------
(function testQueuedRuleColoursOnlyItsToken() {
    reset();
    loadLines([line('Hosts: 1.2.3.4 evil.example')]);

    queueTokenRule('1.2.3.4', 'B');
    applyPendingOverrides();

    assert('the verdict is the queued status', statusOf(0) === 'B', 'got ' + statusOf(0));
    assert(
        'the line itself is not tinted',
        analyzedLines[0].css_class === 'status-unknown',
        'got ' + analyzedLines[0].css_class
    );
    assert('only the token is coloured', highlightShape(0) === '7-14:B:7', 'got ' + highlightShape(0));
})();

(function testEveryOccurrenceIsColoured() {
    reset();
    loadLines([line('1.2.3.4 -> 1.2.3.4')]);

    queueTokenRule('1.2.3.4', 'B');
    applyPendingOverrides();

    assert(
        'each occurrence of the token is coloured',
        highlightShape(0) === '0-7:B:7 11-18:B:7',
        'got ' + highlightShape(0)
    );
})();

(function testSameTierTokenPaintsOverAWeakerWholeLineColour() {
    reset();
    // A whole-line substring rule (C, priority 7) colours this line.
    loadLines([line('R2 a; C:\\bad\\1.2.3.4.exe [X]', 'C', 'substring')]);

    queueTokenRule('1.2.3.4', 'B');
    applyPendingOverrides();

    assert('the stronger verdict takes over', statusOf(0) === 'B', 'got ' + statusOf(0));
    assert(
        'the line keeps its colour',
        analyzedLines[0].css_class === 'status-c',
        'got ' + analyzedLines[0].css_class
    );
    assert(
        'the stronger token is painted on top of it',
        highlightShape(0) === tokenSpan(analyzedLines[0].line, '1.2.3.4', 'B', 7),
        'got ' + highlightShape(0)
    );
})();

(function testSameTierTokenUnderAStrongerWholeLineColour() {
    reset();
    loadLines([line('R2 a; C:\\bad\\1.2.3.4.exe [X]', 'B', 'substring')]);

    queueTokenRule('1.2.3.4', 'C');
    applyPendingOverrides();

    assert('the stronger existing verdict stays', statusOf(0) === 'B', 'got ' + statusOf(0));
    assert('the weaker token is hidden', highlightShape(0) === '', 'got ' + highlightShape(0));
})();

(function testSameTierPartialBaseKeepsItsHighlight() {
    reset();
    const text = 'Microsoft loads 1.2.3.4';
    loadLines([{
        ...line(text, 'C', 'substring'),
        css_class: 'status-unknown',
        paint_base: null,
        highlights: [{ start: 0, end: 9, status: 'C', priority: 7 }],
    }]);

    queueTokenRule('1.2.3.4', 'B');
    applyPendingOverrides();

    assert('the stronger verdict takes over', statusOf(0) === 'B', 'got ' + statusOf(0));
    assert(
        'the existing and the queued match are both coloured, each in its own status',
        highlightShape(0) === '0-9:C:7 16-23:B:7',
        'got ' + highlightShape(0)
    );

    pendingTokenRules.clear();
    applyPendingOverrides();
    assert(
        'dropping the queued rule restores the line as analyzed',
        statusOf(0) === 'C' && highlightShape(0) === '0-9:C:7',
        'got ' + statusOf(0) + ' ' + highlightShape(0)
    );
})();

(function testQueuedRuleOutranksAFilepathFallback() {
    reset();
    const text = 'R2 evil; C:\\bad\\1.2.3.4.sys [X]';
    const pathStart = text.indexOf('C:');
    const pathEnd = pathStart + 'C:\\bad\\1.2.3.4.sys'.length;
    const tokenStart = text.indexOf('1.2.3.4');
    loadLines([{
        ...line(text, 'C', 1),
        matcher: 'filepath',
        css_class: 'status-unknown',
        paint_base: null,
        highlights: [{ start: pathStart, end: pathEnd, status: 'C', priority: 1 }],
        fallback_only: true,
    }]);

    queueTokenRule('1.2.3.4', 'B');
    applyPendingOverrides();

    // The engine ranks a filepath fallback (priority 1) below a substring rule.
    assert('the queued rule wins over the fallback', statusOf(0) === 'B', 'got ' + statusOf(0));
    assert(
        'the token is painted over the fallback path, which stays around it',
        highlightShape(0) === `${pathStart}-${tokenStart}:C:1 ${tokenStart}-${tokenStart + 7}:B:7 ${tokenStart + 7}-${pathEnd}:C:1`,
        'got ' + highlightShape(0)
    );
    assert('the line no longer rests on the fallback', analyzedLines[0].fallback_only === false);
})();

// ---------------------------------------------------------------------------
// Status picker on partially coloured lines (saveStatusSelection)
//
// saveStatusSelection is async but never awaits, so its state changes are done
// by the time the call returns.
// ---------------------------------------------------------------------------

// A line whose verdict comes from a substring rule that colours only its match.
function partialLine(text, token, status) {
    const start = text.indexOf(token);
    return {
        ...line(text, status, 'substring'),
        css_class: 'status-unknown',
        paint_base: null,
        highlights: [{ start, end: start + token.length, status, priority: 7 }],
    };
}

function pendingShape() {
    return [...pendingStatusChanges.values()]
        .map((change) => `${change.original_status}->${change.new_status}`)
        .join(' ');
}

(function testSameStatusQueuesFullRuleOnPartialLine() {
    reset();
    const text = 'R1 evil; C:\\bad\\evil.sys [X]';
    loadLines([partialLine(text, 'evil.sys', 'B')]);

    saveStatusSelection(0, 'B');

    assert('picking the verdict queues a same-status override', pendingShape() === 'B->B', 'got ' + pendingShape());
    assert(
        'the queued full rule colours the whole line',
        analyzedLines[0].css_class === STATUS_CLASS_MAP.B && highlightShape(0) === '',
        'got ' + analyzedLines[0].css_class + ' / ' + highlightShape(0)
    );

    saveStatusSelection(0, 'B');

    assert('picking it again removes the override', pendingStatusChanges.size === 0, 'got ' + pendingShape());
    assert(
        'the partial colouring comes back',
        analyzedLines[0].css_class === 'status-unknown' && highlightShape(0) === tokenSpan(text, 'evil.sys', 'B', 7),
        'got ' + analyzedLines[0].css_class + ' / ' + highlightShape(0)
    );
    reset();
})();

(function testOtherStatusTogglesOnPartialLine() {
    reset();
    loadLines([partialLine('R1 evil; C:\\bad\\evil.sys [X]', 'evil.sys', 'B')]);

    saveStatusSelection(0, 'P');
    assert('picking another status queues it', pendingShape() === 'B->P', 'got ' + pendingShape());

    saveStatusSelection(0, 'B');
    assert('picking the verdict then switches to a same-status override', pendingShape() === 'B->B', 'got ' + pendingShape());

    saveStatusSelection(0, 'P');
    saveStatusSelection(0, 'P');
    assert('picking the active status again removes it', pendingStatusChanges.size === 0, 'got ' + pendingShape());
    assert('the verdict is back to the analyzed one', statusOf(0) === 'B', 'got ' + statusOf(0));
    reset();
})();

(function testWholeLineVerdictKeepsNoOp() {
    reset();
    loadLines([line('R1 evil; C:\\bad\\evil.sys [X]', 'B', 'exact')]);

    saveStatusSelection(0, 'B');
    assert('a fully coloured line gets no same-status override', pendingStatusChanges.size === 0, 'got ' + pendingShape());
    reset();
})();

(function testNormalLineRevertsByPickingBaseStatus() {
    reset();
    loadLines([line('R1 evil; C:\\bad\\evil.sys [X]', 'C', 'exact')]);

    saveStatusSelection(0, 'B');
    assert('an override is queued', pendingShape() === 'C->B', 'got ' + pendingShape());

    saveStatusSelection(0, 'C');
    assert('picking the analyzed status removes it', pendingStatusChanges.size === 0, 'got ' + pendingShape());
    reset();
})();

(function testFallbackOnlyLineStillQueues() {
    reset();
    const text = 'R2 evil; C:\\bad\\evil.sys [X]';
    const pathStart = text.indexOf('C:');
    loadLines([{
        ...line(text, 'C', 1),
        matcher: 'filepath',
        css_class: 'status-unknown',
        paint_base: null,
        highlights: [{ start: pathStart, end: pathStart + 'C:\\bad\\evil.sys'.length, status: 'C', priority: 1 }],
        fallback_only: true,
    }]);

    saveStatusSelection(0, 'C');
    assert('a fallback-only line queues a same-status override', pendingShape() === 'C->C', 'got ' + pendingShape());
    reset();
})();

(function testDifferentBaseColourCountsAsPartial() {
    reset();
    // A substring B and a whole-line regex C share a tier: B wins the verdict,
    // but the line text is C with only the substring in B.
    const text = 'R1 evil; C:\\bad\\evil.sys [X]';
    const start = text.indexOf('evil.sys');
    loadLines([{
        ...line(text, 'B', 7),
        css_class: STATUS_CLASS_MAP.C,
        paint_base: { status: 'C', priority: 7 },
        highlights: [{ start, end: start + 'evil.sys'.length, status: 'B', priority: 7 }],
    }]);

    assert('the line counts as partially coloured', verdictIsPartiallyColored(analyzedLines[0]) === true);
    saveStatusSelection(0, 'B');
    assert('picking the verdict queues a same-status override', pendingShape() === 'B->B', 'got ' + pendingShape());
    reset();
})();

(function testUnknownLineIsNotPartial() {
    reset();
    loadLines([line('R1 something; C:\\x.sys [X]')]);
    assert('an unknown line is not partially coloured', verdictIsPartiallyColored(analyzedLines[0]) === false);
    reset();
})();

// ---------------------------------------------------------------------------
// The menu itself
// ---------------------------------------------------------------------------
(function testItemOfferedForEveryKind() {
    const kinds = ['chrome-ext-id', 'edge-ext-id', 'ipv4', 'ipv6', 'url', 'domain'];
    for (const kind of kinds) {
        reset();
        openLookupMenu(makeTrigger(), 'sample-value', kind);
        assert('rule item offered for kind: ' + kind, Boolean(ruleItem()), menuLabels().join(' | '));
    }
    reset();
})();

(function testStatusSubmenu() {
    reset();
    openLookupMenu(makeTrigger(), '1.2.3.4', 'ipv4');
    const beforeCount = menuItems().length;
    ruleItem().click();

    const labels = menuLabels();
    const statusCodes = labels.slice(0, -1).map((text) => text.trim().charAt(0));

    assert(
        'status list offers B P C ! G S J',
        statusCodes.join('') === 'BPC!GSJ',
        'got ' + statusCodes.join('')
    );
    assert('unknown is not offered (it would be a no-op rule)', statusCodes.indexOf('?') === -1);
    assert('informational is not offered (rejected server-side)', statusCodes.indexOf('I') === -1);
    assert('last item is back', labels[labels.length - 1] === 'back', 'got ' + labels[labels.length - 1]);
    assert(
        'status buttons carry their status colour class',
        menuItems()[0].classList.contains('status-b'),
        menuItems()[0].className
    );

    menuItems()[menuItems().length - 1].click();
    assert(
        'back restores the lookup items',
        menuItems().length === beforeCount && Boolean(ruleItem()),
        menuLabels().join(' | ')
    );
    reset();
})();

(function testPickingAStatusQueuesRatherThanSaves() {
    reset();
    loadLines([line('Hosts: 1.2.3.4 evil.example')]);
    openLookupMenu(makeTrigger(), '1.2.3.4', 'ipv4');
    ruleItem().click();

    const malwareButton = menuItems()[0];
    malwareButton.click();

    assert('the rule is queued', pendingTokenRules.size === 1, 'got ' + pendingTokenRules.size);
    assert(
        'the queued rule carries the chosen status',
        getPendingStatusChangesPayload()[0].new_status === 'B',
        'got ' + getPendingStatusChangesPayload()[0].new_status
    );
    assert(
        'the button says it is queued, not saved',
        malwareButton.textContent === 'queued for save',
        'got ' + malwareButton.textContent
    );
    assert(
        'the matching line is reclassified right away',
        statusOf(0) === 'B',
        'got ' + statusOf(0)
    );
    reset();
})();

(function testGuestGating() {
    assert('rule item is offered while signed in', canCreateLookupRules() === true);
})();

// ---------------------------------------------------------------------------
