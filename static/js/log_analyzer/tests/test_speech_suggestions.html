<!DOCTYPE html>
<!--
  Tests for speech_suggestions.js: which speeches are suggested for the rule
  tags found in a log (dropdown and warning boxes), the tag names behind a
  line's tooltip, and the one-tag line filter.

  A speech is suggested when any of its trigger tags is among the tags found.
  A speech without trigger tags is never suggested.

  Open this file directly in a browser (no build step needed).
  Pass = green row, Fail = red row with an error message.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>speech suggestion tests</title>
<style>
  body { font-family: monospace; padding: 16px; background: #1a1a1a; color: #ccc; }
  h1   { font-size: 1rem; margin-bottom: 12px; }
  .pass { color: #6f9; }
  .fail { color: #f66; }
  #summary { margin-top: 12px; font-weight: bold; }
</style>
</head>
<body>
<h1>speech_suggestions.js – suggestion tests</h1>
<ul id="results"></ul>
<div id="summary"></div>

<script>
window.logAnalyzerConfig = { speeches: [] };
</script>
<script src="../../rule_tag_picker.js"></script>
<script src="../speech_suggestions.js"></script>

<script>
let passed = 0;
let failed = 0;
const list = document.getElementById('results');

function assert(description, condition, detail) {
    const li = document.createElement('li');
    li.className = condition ? 'pass' : 'fail';
    li.textContent = (condition ? '✓ ' : '✗ ') + description + (!condition && detail ? ' — ' + detail : '');
    if (condition) passed++; else failed++;
    list.appendChild(li);
}

function assertIds(description, actual, expected) {
    const a = JSON.stringify([...actual].sort());
    const e = JSON.stringify([...expected].sort());
    assert(description, a === e, 'got ' + a);
}

const speeches = [
    { id: 1, name: 'renloader cleanup', trigger_tag_ids: [7] },
    { id: 2, name: 'two AVs', trigger_tag_ids: [90] },
    { id: 3, name: 'either', trigger_tag_ids: [7, 90] },
    { id: 4, name: 'no triggers', trigger_tag_ids: [] },
];

(function testSuggestionsByTag() {
    assertIds('a found tag suggests its speeches',
        computeSuggestedSpeechIds(speeches, [7]), [1, 3]);
    assertIds('a built-in warning tag works like any other tag',
        computeSuggestedSpeechIds(speeches, [90]), [2, 3]);
    assertIds('no tags found, no suggestions',
        computeSuggestedSpeechIds(speeches, []), []);
    assertIds('a speech without trigger tags is never suggested',
        computeSuggestedSpeechIds([speeches[3]], [7, 90]), []);
})();

(function testWarningBoxMatching() {
    // A warning box carries the built-in tag of its code or its alert rules' tags.
    const forWarning = speechesForTags([90], speeches).map((speech) => speech.name);
    assert('a warning box lists the speeches for its own tags',
        JSON.stringify(forWarning) === JSON.stringify(['either', 'two AVs']),
        'got ' + JSON.stringify(forWarning));
    assert('a warning without tags lists none', speechesForTags([], speeches).length === 0);
})();

(function testTagNamesAndFilter() {
    updateSpeechSuggestionsFromAnalysis({
        rule_tags: [
            { id: 7, name: 'renloader', description: 'RenPy loader family', line_count: 2 },
            { id: 8, name: 'adware', line_count: 1 },
        ],
    });
    assert('tags for a line come in its tag order, with descriptions',
        JSON.stringify(ruleTagsFor([8, 7]).map((tag) => [tag.name, tag.description]))
            === JSON.stringify([['adware', ''], ['renloader', 'RenPy loader family']]));
    assert('unknown tag ids are skipped', ruleTagsFor([99]).length === 0);

    assert('no filter: no line counts as a filter match', !lineMatchesTagFilter({ tag_ids: [7] }));
    setTagFilter(7);
    assert('with a filter, a line carrying the tag matches', lineMatchesTagFilter({ tag_ids: [7, 8] }));
    assert('with a filter, a line without the tag does not', !lineMatchesTagFilter({ tag_ids: [8] }));
    updateSpeechSuggestionsFromAnalysis({ rule_tags: [] });
    assert('a new analysis clears the filter', !lineMatchesTagFilter({ tag_ids: [7] }));
})();

(function testTaggedAndSpeechFilters() {
    const config = window.logAnalyzerConfig;
    const savedSpeeches = config.speeches;
    config.speeches = [{ id: 40, name: 'own', trigger_tag_ids: [7] }];
    config.sharedTagSpeeches = [{ id: 41, name: 'shared', trigger_tag_ids: [9] }];
    const lines = [
        { tag_ids: [7] }, { tag_ids: [8] }, { tag_ids: [9, 8] }, { tag_ids: [] }, {},
    ];
    const speechTags = speechTriggerTagIds(config.speeches, config.sharedTagSpeeches);
    const counts = tagFilterCounts(lines, speechTags);
    assert('"tagged" counts every line with a tag', counts.tagged === 3, JSON.stringify(counts));
    assert('"with speech" counts lines an own or shared speech fits', counts.withSpeech === 2, JSON.stringify(counts));

    setTagFilter(TAG_FILTER_ANY_TAG);
    assert('"tagged" shows a line with any tag',
        lineMatchesTagFilter({ tag_ids: [8] }) && lineMatchesTagFilter({ tag_ids: [7] }));
    assert('"tagged" hides lines without tags',
        !lineMatchesTagFilter({ tag_ids: [] }) && !lineMatchesTagFilter({}));

    setTagFilter(TAG_FILTER_WITH_SPEECH);
    assert('"with speech" shows a line an own speech fits', lineMatchesTagFilter({ tag_ids: [7] }));
    assert('"with speech" shows a line only a shared speech fits', lineMatchesTagFilter({ tag_ids: [8, 9] }));
    assert('"with speech" hides a tagged line no speech fits', !lineMatchesTagFilter({ tag_ids: [8] }));

    setTagFilter(null);
    assert('no filter after clearing it', !lineMatchesTagFilter({ tag_ids: [7] }));
    config.speeches = savedSpeeches;
    delete config.sharedTagSpeeches;
})();

(function testTagsRowFilterButtons() {
    const row = document.createElement('div');
    row.id = 'ruleTagsLine';
    document.body.appendChild(row);
    const config = window.logAnalyzerConfig;
    const savedSpeeches = config.speeches;
    config.speeches = [{ id: 50, name: 'own', trigger_tag_ids: [7] }];
    window.analyzedLines = [{ tag_ids: [7] }, { tag_ids: [8] }, { tag_ids: [] }];
    updateSpeechSuggestionsFromAnalysis({
        rule_tags: [{ id: 7, name: 'renloader', line_count: 1 }, { id: 8, name: 'adware', line_count: 1 }],
    });
    const button = (id) => row.querySelector(`[data-tag-filter="${id}"]`);
    assert('the tags row has a "tagged" button with its count',
        button(TAG_FILTER_ANY_TAG) && button(TAG_FILTER_ANY_TAG).textContent === 'tagged (2)',
        button(TAG_FILTER_ANY_TAG) && button(TAG_FILTER_ANY_TAG).textContent);
    assert('the tags row has a "with speech" button with its count',
        button(TAG_FILTER_WITH_SPEECH) && button(TAG_FILTER_WITH_SPEECH).textContent === 'with speech (1)',
        button(TAG_FILTER_WITH_SPEECH) && button(TAG_FILTER_WITH_SPEECH).textContent);

    button(TAG_FILTER_WITH_SPEECH).click();
    assert('clicking "with speech" filters by it', activeTagFilterId === TAG_FILTER_WITH_SPEECH);
    assert('a tag with a speech is not faded under "with speech"',
        !button(7).parentElement.classList.contains('tag-chip-filtered-out'));
    assert('a tag without a speech is faded under "with speech"',
        button(8).parentElement.classList.contains('tag-chip-filtered-out'));
    button(TAG_FILTER_WITH_SPEECH).click();
    assert('clicking it again clears the filter', activeTagFilterId === null);

    button(TAG_FILTER_ANY_TAG).click();
    assert('under "tagged" no tag is faded',
        !row.querySelector('.tag-text.tag-chip-filtered-out'));
    button(TAG_FILTER_ANY_TAG).click();

    config.speeches = [];
    updateSpeechSuggestionsFromAnalysis({ rule_tags: [{ id: 8, name: 'adware', line_count: 1 }] });
    assert('"with speech" is disabled when no line has a speech', button(TAG_FILTER_WITH_SPEECH).disabled);

    config.speeches = savedSpeeches;
    delete window.analyzedLines;
    updateSpeechSuggestionsFromAnalysis({ rule_tags: [] });
    row.remove();
})();

(function testAlreadyInTheResponse() {
    const greeting = { id: 20, content: 'Hi {USERNAME},\nplease run FRST and post both logs here.', trigger_tag_ids: [7] };
    const short = { id: 21, content: '{COUNTER}. ok', trigger_tag_ids: [7] };

    assert('the fingerprint skips placeholders and takes the longest passage',
        speechFingerprint(greeting.content) === 'please run frst and post both logs here',
        speechFingerprint(greeting.content));
    assert('a speech with only short text has no fingerprint', speechFingerprint(short.content) === '');

    const filled = 'Hi bob,\n\nplease   run FRST and post both logs   here.\nThanks';
    assert('a speech inserted with filled placeholders counts as used',
        withoutUsedSpeeches([greeting], filled).length === 0);
    assert('it is suggested again once its text is gone',
        withoutUsedSpeeches([greeting], 'Hi bob, thanks').length === 1);
    assert('a speech without fingerprint is never taken for used',
        withoutUsedSpeeches([short], '1. ok').length === 1);
    assert('used speeches drop out of the dropdown suggestions',
        computeSuggestedSpeechIds([greeting], [7], filled).length === 0);
})();

(function testLineClick() {
    const one = { id: 30, content: 'Uninstall the toolbar from the control panel, then reboot.', trigger_tag_ids: [7] };
    const two = { id: 31, content: 'Reset your browser settings to their defaults afterwards.', trigger_tag_ids: [7, 8] };
    const ids = (list) => JSON.stringify(list.map((speech) => speech.id));

    assert('one fitting speech', ids(speechesForLineClick({ tag_ids: [8] }, [one, two], '')) === '[31]');
    assert('several fitting speeches', ids(speechesForLineClick({ tag_ids: [7] }, [one, two], '')) === '[30,31]');
    assert('a speech already in the response is left out',
        ids(speechesForLineClick({ tag_ids: [7] }, [one, two], one.content)) === '[31]');
    assert('a line without tags fits nothing', speechesForLineClick({ tag_ids: [] }, [one, two], '').length === 0);
})();

(function testFallbackToOtherHelpers() {
    const mine = { id: 40, content: 'My own text about the renloader family here.', trigger_tag_ids: [7] };
    const theirsSame = { id: 41, content: 'Their text about the renloader family here.', trigger_tag_ids: [7] };
    const theirsOther = { id: 42, content: 'Their text about adware cleanup in browsers.', trigger_tag_ids: [8] };
    const ids = (list) => JSON.stringify(list.map((speech) => speech.id));

    assert('only tags no own speech covers fall back',
        ids(fallbackSpeechesForTags([7, 8], [mine], [theirsSame, theirsOther])) === '[42]');
    assert('a covered tag gets no fallback even if its own speech is already used',
        ids(fallbackSpeechesForTags([7], [mine], [theirsSame], mine.content)) === '[]');
    assert('fallback speeches already in the response are left out',
        ids(fallbackSpeechesForTags([8], [mine], [theirsOther], theirsOther.content)) === '[]');
    assert('a line click falls back when no own speech fits',
        ids(speechesForLineClick({ tag_ids: [8] }, [mine], '', [theirsOther])) === '[42]');
    assert('own speeches win over fallback on a line click',
        ids(speechesForLineClick({ tag_ids: [7] }, [mine], '', [theirsSame])) === '[40]');
})();

(function testManyTags() {
    updateSpeechSuggestionsFromAnalysis({
        rule_tags: ['echo', 'alpha', 'delta', 'Charlie', 'bravo'].map((name, index) => ({ id: 100 + index, name })),
    });

    const speeches = [
        { id: 1, name: 'zulu speech', content: 'A long enough passage for zulu here.', trigger_tag_ids: [100] },
        { id: 2, name: 'Alpha speech', content: 'A long enough passage for alpha here.', trigger_tag_ids: [101] },
    ];
    const order = speechesForLineClick({ tag_ids: [100, 101] }, speeches, '').map((speech) => speech.name);
    assert('fitting speeches come alphabetically',
        JSON.stringify(order) === JSON.stringify(['Alpha speech', 'zulu speech']), JSON.stringify(order));
    assert('insert all follows the same order',
        JSON.stringify(speechesToInsertAll(speeches).map((speech) => speech.id)) === '[2,1]');
})();

(function testMenuOpeningClickDoesNotCloseIt() {
    window.logAnalyzerConfig.speeches = [
        { id: 1, name: 'one', content: 'A long enough passage number one here.', trigger_tag_ids: [100] },
        { id: 2, name: 'two', content: 'A long enough passage number two here.', trigger_tag_ids: [101] },
    ];
    let stopped = false;
    const fakeEvent = { stopPropagation() { stopped = true; } };
    const anchor = { getBoundingClientRect: () => ({ left: 0, bottom: 0 }) };
    handleResponseLineClick({ tag_ids: [100, 101] }, anchor, fakeEvent);
    assert('the line click stops at the line, so the document does not close the menu', stopped);
    assert('the pick menu is opened',
        [...document.body.children].some((element) => element.id === 'lineSpeechMenu'));
    closeLineSpeechMenu();
    window.logAnalyzerConfig.speeches = [];
})();

(function testMenuOpensWhereClicked() {
    const anchor = { getBoundingClientRect: () => ({ left: 10, top: 40, bottom: 60 }) };
    const atPoint = document.createElement('div');
    placeNear(atPoint, anchor, { x: 300, y: 200 });
    assert('a menu opens at the clicked point',
        atPoint.style.left === `${302 + window.scrollX}px` && atPoint.style.top === `${202 + window.scrollY}px`,
        `${atPoint.style.left} ${atPoint.style.top}`);
    const withoutPoint = document.createElement('div');
    placeNear(withoutPoint, anchor, clickPoint({ clientX: 0, clientY: 0 }));
    assert('a keyboard click (no pointer) falls back to below the line',
        withoutPoint.style.top === `${62 + window.scrollY}px`, withoutPoint.style.top);
})();

(function testLineInspectorTagRows() {
    updateSpeechSuggestionsFromAnalysis({
        rule_tags: [
            { id: 201, name: 'zeta', description: 'last one' },
            { id: 202, name: 'Alpha' },
        ],
    });
    const rows = lineInspectorTagRows([201, 202]);
    assert('inspector rows are alphabetical with descriptions, empty when none',
        JSON.stringify(rows) === JSON.stringify([
            { name: 'Alpha', description: '', category_id: null },
            { name: 'zeta', description: 'last one', category_id: null },
        ]), JSON.stringify(rows));
    assert('a line without tags has no rows', lineInspectorTagRows([]).length === 0);
    updateSpeechSuggestionsFromAnalysis({ rule_tags: [] });
})();

(function testTagCategoryColours() {
    updateSpeechSuggestionsFromAnalysis({
        rule_tags: [
            { id: 301, name: 'coloured', category_id: 4, line_count: 1 },
            { id: 302, name: 'plain', line_count: 1 },
        ],
    });
    assert('a tag keeps its category through ruleTagsFor',
        ruleTagsFor([301])[0].category_id === 4);
    assert('the inspector rows keep the category',
        lineInspectorTagRows([301])[0].category_id === 4);
    assert('tagCategoryClass is empty without a category',
        tagCategoryClass({ category_id: null }) === '' && tagCategoryClass({ category_id: 9 }) === ' tag-cat-9');
    updateSpeechSuggestionsFromAnalysis({ rule_tags: [] });
})();

(function testLineSuggestionItems() {
    const config = {
        speeches: [
            { id: 1, name: 'own b', trigger_tag_ids: [7] },
            { id: 2, name: 'own a', trigger_tag_ids: [7, 8] },
        ],
        sharedTagSpeeches: [
            { id: 3, name: 'shared for 7', trigger_tag_ids: [7] },
            { id: 4, name: 'shared for 9', trigger_tag_ids: [9] },
        ],
        snippets: [],
        sharedTagSnippets: [{ id: 5, name: 'shared snippet', trigger_tag_ids: [7] }],
    };
    const names = (list) => JSON.stringify(list.map((entry) => [entry.item.name, entry.shared]));
    const forSeven = lineSuggestionItems([7], config);
    assert('own speeches come alphabetically and win over shared ones',
        names(forSeven.speeches) === JSON.stringify([['own a', false], ['own b', false]]), names(forSeven.speeches));
    assert('with no own snippet, shared ones fill in',
        names(forSeven.snippets) === JSON.stringify([['shared snippet', true]]), names(forSeven.snippets));
    assert('a tag no own speech covers gets the shared one',
        names(lineSuggestionItems([9], config).speeches) === JSON.stringify([['shared for 9', true]]));
    const none = lineSuggestionItems([42], config);
    assert('a line no item fits gets nothing', !none.speeches.length && !none.snippets.length);
})();

(function testLineSuggestionChips() {
    const config = window.logAnalyzerConfig;
    const saved = { speeches: config.speeches, snippets: config.snippets };
    const response = document.createElement('textarea');
    response.id = 'responseText';
    const fixlist = document.createElement('textarea');
    fixlist.id = 'selectedLines';
    document.body.append(response, fixlist);
    config.speeches = [
        { id: 60, name: 'reset browser', content: 'Reset your browser settings to their defaults.', trigger_tag_ids: [7] },
        { id: 61, name: 'adw cleaner', content: 'Download AdwCleaner and run a scan please.', trigger_tag_ids: [7] },
    ];
    config.snippets = [{ id: 62, name: 'empty temp', content: 'EmptyTemp:', trigger_tag_ids: [7] }];

    let chips = buildLineSuggestionChips([7]);
    const labels = chips.map((chip) => chip.textContent);
    assert('speeches first, alphabetically, then snippets',
        JSON.stringify(labels) === JSON.stringify(['adw cleaner', 'reset browser', 'empty temp']), JSON.stringify(labels));
    assert('speech and snippet chips look different',
        chips[0].classList.contains('line-speech-chip') && chips[2].classList.contains('line-snippet-chip'));
    assert('nothing is faded before it is used', !chips.some((chip) => chip.classList.contains('line-chip-used')));

    response.value = 'Hi,\n\nReset your   browser settings to their defaults.\n';
    fixlist.value = 'EmptyTemp:\n';
    chips = buildLineSuggestionChips([7]);
    assert('a speech in the response is faded',
        chips[1].classList.contains('line-chip-used') && !chips[0].classList.contains('line-chip-used'));
    assert('a snippet in the panel showing is faded', chips[2].classList.contains('line-chip-used'));
    assert('a faded chip says why', chips[1].title.includes('already in the response'), chips[1].title);

    const calls = [];
    const savedInsertSpeech = window.insertSpeechById;
    const savedInsertSnippet = window.insertSnippetById;
    window.insertSpeechById = (id) => calls.push(['speech', id]);
    window.insertSnippetById = (id) => calls.push(['snippet', id]);
    let bubbled = false;
    const line = document.createElement('div');
    line.addEventListener('click', () => { bubbled = true; });
    chips.forEach((chip) => line.appendChild(chip));
    chips[0].click();
    chips[2].click();
    assert('clicking a chip inserts its speech or snippet',
        JSON.stringify(calls) === JSON.stringify([['speech', 61], ['snippet', 62]]), JSON.stringify(calls));
    assert('a chip click does not reach the line', !bubbled);

    config.speeches = [1, 2, 3, 4].map((n) => ({ id: 70 + n, name: `speech ${n}`, content: 'x', trigger_tag_ids: [7] }));
    chips = buildLineSuggestionChips([7]);
    assert('three chips, then +N for the rest',
        JSON.stringify(chips.map((chip) => chip.textContent)) === JSON.stringify(['speech 1', 'speech 2', 'speech 3', '+2']),
        JSON.stringify(chips.map((chip) => chip.textContent)));

    // The chips follow edits: refreshLineSuggestionChips rebuilds the boxes.
    const logLines = document.createElement('div');
    logLines.id = 'logLines';
    const box = document.createElement('span');
    box.className = 'line-tag-chips';
    box.dataset.tagIds = '[7]';
    logLines.appendChild(box);
    document.body.appendChild(logLines);
    config.speeches = saved.speeches;
    config.snippets = [{ id: 62, name: 'empty temp', content: 'EmptyTemp:', trigger_tag_ids: [7] }];
    fixlist.value = '';
    refreshLineSuggestionChips();
    assert('a refresh rebuilds a line\'s chips',
        box.children.length === 1 && !box.firstChild.classList.contains('line-chip-used'));
    fixlist.value = 'EmptyTemp:';
    refreshLineSuggestionChips();
    assert('and fades one that is now used', box.firstChild.classList.contains('line-chip-used'));
    config.snippets = saved.snippets;
    refreshLineSuggestionChips();
    assert('a box with nothing left goes away', !logLines.contains(box));

    window.insertSpeechById = savedInsertSpeech;
    window.insertSnippetById = savedInsertSnippet;
    logLines.remove();
    response.remove();
    fixlist.remove();
})();

(function testInsertAllLeavesEmptyLinesBetweenSpeeches() {
    const calls = [];
    const saved = window.insertSpeechById;
    window.insertSpeechById = (id, options) => calls.push([id, Boolean(options && options.blankLineBefore)]);
    const anchor = document.createElement('div');
    document.body.appendChild(anchor);
    openLineSpeechMenu([
        { id: 2, name: 'b', trigger_tag_ids: [] },
        { id: 1, name: 'a', trigger_tag_ids: [] },
        { id: 3, name: 'c', trigger_tag_ids: [] },
    ], anchor);
    document.querySelector('#lineSpeechMenu .line-speech-menu-item').click();
    assert('insert all puts an empty line above every speech but the first',
        JSON.stringify(calls) === JSON.stringify([[1, false], [2, true], [3, true]]), JSON.stringify(calls));
    window.insertSpeechById = saved;
    anchor.remove();
})();

document.getElementById('summary').textContent =
    failed === 0 ? `ALL PASS (${passed})` : `${failed} FAILED, ${passed} passed`;
document.getElementById('summary').className = failed === 0 ? 'pass' : 'fail';
</script>
</body>
</html>
